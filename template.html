<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITEL}}</title>
<style>
  :root { --vrij:#2e8b57; --vrij-bg:#e3f4ea; --bezet:#b9bec7; --tekst:#1f2933; --zacht:#6b7280; --lijn:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--tekst); background:#fafafa; }
  main { max-width:980px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1.1rem; margin:32px 0 12px; }
  h3 { font-size:1rem; margin:0 0 8px; }
  .meta { color:var(--zacht); font-size:.9rem; margin:0 0 4px; }
  .kaarten { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; }
  .kaart { background:#fff; border:1px solid var(--lijn); border-left:4px solid var(--vrij); border-radius:8px; padding:12px 14px; }
  .kaart ul { margin:0; padding:0; list-style:none; }
  .kaart li { font-weight:600; color:var(--vrij); font-variant-numeric:tabular-nums; }
  .kaart li.geen { color:var(--zacht); font-weight:400; }
  section { background:#fff; border:1px solid var(--lijn); border-radius:8px; padding:14px; margin-bottom:16px; }
  .rij { display:flex; align-items:center; gap:10px; margin:4px 0; }
  .dag { width:90px; flex:none; font-size:.85rem; color:var(--zacht); }
  .balk { position:relative; flex:1; height:26px; background:#f3f4f6; border-radius:4px; overflow:hidden; }
  .schaal { position:relative; flex:1; height:16px; font-size:.7rem; color:var(--zacht); }
  .schaal span { position:absolute; transform:translateX(-50%); }
  .blok { position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:.7rem; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .blok.vrij { background:var(--vrij-bg); color:var(--vrij); font-weight:600; border-left:1px solid #fff; }
  .blok.bezet { background:var(--bezet); color:#374151; border-left:1px solid #fff; }
  .blok.bezet[title*="Gebouw gesloten"] { background:repeating-linear-gradient(45deg,#d1d5db 0 4px,#e5e7eb 4px 8px); }
  .blok.bezet span { visibility:hidden; }
  .legende { display:flex; gap:16px; font-size:.85rem; color:var(--zacht); margin:8px 0 0; flex-wrap:wrap; }
  .legende i { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:6px; }
  @media (max-width:600px) { .dag { width:70px; font-size:.75rem; } .blok span { display:none; } }
</style>
</head>
<body>
<main>
  <h1>{{TITEL}}</h1>
  <p class="meta">Laatst bijgewerkt: {{BIJGEWERKT}}</p>
  <p class="meta">{{UITLEG}}</p>

  <h2>{{TITEL_DAG}}: vrij om te studeren</h2>
  <div class="kaarten">{{VANDAAG}}</div>

  <h2>Komende dagen</h2>
  <div class="legende">
    <span><i style="background:var(--vrij-bg);border:1px solid var(--vrij)"></i>vrij</span>
    <span><i style="background:var(--bezet)"></i>bezet</span>
    <span><i style="background:repeating-linear-gradient(45deg,#d1d5db 0 3px,#e5e7eb 3px 6px)"></i>gebouw gesloten</span>
  </div>
  {{WEKEN}}
</main>
</body>
</html>
